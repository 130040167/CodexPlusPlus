[package]
name = "codex-plus-manager"
default-run = "codex-plus-plus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "codex_plus_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-plus-plus"
path = "src/main.rs"

[[bin]]
name = "codex-plus-legacy-shim"
path = "src/legacy_shim.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
codex-plus-core = { path = "../../../crates/codex-plus-core" }
codex-plus-data = { path = "../../../crates/codex-plus-data" }
codex-plus-launcher = { path = "../../codex-plus-launcher" }
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
toml_edit.workspace = true

# ZCode 语音输入的录音端：ZCode 自身缺麦克风 entitlement，改由管理端用系统
# 默认输入设备录音（详见 src/mic.rs 的说明）。只在 macOS 需要，其它平台不装。
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
